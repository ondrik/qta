name: Pages

# Publishes the whole site on every push to master: the latest game at the root and every
# released version (tags v1, v2, ...) under /v/<tag>/. Tags are pushed together with the
# commit they name, so the branch push already republishes them; run the workflow by hand
# after tagging an older commit on its own.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # every tag is rebuilt from its own source
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: The game must at least parse
        run: node --check game.js
      - name: Build the site and the archive of versions
        run: node tools/release.mjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
