<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quant Theft Auto</title>
<meta name="description" content="A lightweight top-down open-city crime sandbox with quantum mechanics: superposed cars, entangled swaps and uncertain cops.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the title font, without holding up the page: until it arrives (or if it never does) the canvas uses Impact -->
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet"></noscript>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  .tb { position: absolute; pointer-events: auto; width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); color: #fff;
    font: bold 22px sans-serif; display: flex; align-items: center; justify-content: center; }
  .tb.down { background: rgba(255,255,255,.35); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="tb" data-k="left"  style="left:16px;bottom:36px">◀</div>
  <div class="tb" data-k="right" style="left:96px;bottom:36px">▶</div>
  <div class="tb" data-p="KeyQ"  style="left:56px;bottom:116px;width:48px;height:48px;font-size:16px">Q</div>
  <div class="tb" data-k="up"    style="right:96px;bottom:104px">▲</div>
  <div class="tb" data-k="down"  style="right:96px;bottom:28px">▼</div>
  <div class="tb" data-k="fire"  style="right:16px;bottom:66px">●</div>
  <div class="tb" data-p="Enter" style="right:16px;bottom:146px;width:56px;height:56px">⇄</div>
  <div class="tb" data-p="KeyX"  style="right:176px;bottom:28px;width:52px;height:52px;color:#c9b3ff">ψ</div>
  <div class="tb" data-p="KeyT"  style="right:176px;bottom:96px;width:52px;height:52px;color:#3cf0ff">ε</div>
  <div class="tb" data-p="KeyG"  style="right:176px;bottom:164px;width:52px;height:52px;color:#ff8ad8">⌖</div>
  <div class="tb" data-p="KeyR"  style="right:20px;top:150px;width:44px;height:44px;font-size:14px">♪</div>
  <div class="tb" data-p="KeyP"  style="right:72px;top:150px;width:44px;height:44px;font-size:14px">II</div>
</div>
<div id="boot" style="position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;color:#8a949e;font:15px system-ui,sans-serif;pointer-events:none"></div>
<script>
// inner Brno's data and the game start only once the page has been painted, so that while they are set up (a few
// seconds, longer on a slow machine) the line above shows instead of a blank page; both download at once and run in order
(() => {
  let m = null; try { m = new URLSearchParams(location.search).get('map') || localStorage.getItem('qta.map'); } catch (e) {}
  const brno = m === 'brno5' || m === 'brno', boot = document.getElementById('boot');
  if (brno) boot.textContent = 'Building inner Brno…';
  requestAnimationFrame(() => setTimeout(() => {
    for (const src of brno ? ['brno5_data.js', 'game.js'] : ['game.js']) {
      const s = document.createElement('script'); s.src = src; s.async = false;
      if (src === 'game.js') s.onload = s.onerror = () => boot.remove();
      document.body.appendChild(s);
    }
  }));
})();
</script>
</body>
</html>
